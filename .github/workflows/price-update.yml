name: Actualización diaria de precios

on:
  schedule:
    - cron: "0 4 * * 2-6"   # 04:00 UTC (22:00 CDMX), martes–sábado, tras el cierre de NY
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.data.price_updater
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_SERVICE_API_KEY: ${{ secrets.ML_SERVICE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
