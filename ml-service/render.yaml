services:
  # =========================================================
  # 1. Web Service — FastAPI (atiende llamadas de Next.js)
  # =========================================================
  - type: web
    name: tt-portfolio-ml-service
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false  # se configura manualmente en el dashboard de Render
      - key: ML_SERVICE_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO

  # =========================================================
  # Los jobs periódicos (precios diarios y reentrenamiento mensual del LSTM)
  # corren en GitHub Actions (gratis) en vez de Render Cron Jobs (de pago):
  #   .github/workflows/price-update.yml
  #   .github/workflows/lstm-retrain.yml
  # Secrets requeridos en GitHub: DATABASE_URL, ML_SERVICE_API_KEY, ALPHA_VANTAGE_API_KEY
  # =========================================================
